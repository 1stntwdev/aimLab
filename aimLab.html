<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">

<body>
  <div class="conatainer">
    <div class="btn-area" >
      <div><button data-ico="🔫"  id="practice-btn" type="button">Practice Aim</button></div>
      <div><button id="exit-btn" class="exit-btn" type="button">Exit</button></div>
    </div>
    <div class="btn-level">
      <input id="hard-btn" type="radio" name="levelAim" value="hard"><label for="hard-btn">HARD</label>
      <input id="normal-btn" type="radio" name="levelAim" value="normal" checked><label for="normal-btn">NORMAL</label>
      <input id="easy-btn" type="radio" name="levelAim" value="easy"><label for="easy-btn">EASY</label>
      <button id="start-btn" type="button" data-ico="▄︻デ══━一💥">Start</button>
    </div>

    <div class="title">
      <input id="input-game" type="text" value="wait for game..."  readonly>
    </div>

    <div id="aim-area">
      <div id="target" ></div>

    </div>
  </div>
</body>
 <script type="module" src="./practice.js"></script>
