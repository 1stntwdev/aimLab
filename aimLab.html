<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aim Lab</title>
</head>
<style>
  .container{
    width: 1200px;
    margin: 0 auto;
  }
 
</style>
<body>
  <div class="conatainer">
    <div class="btn-area" style="display: flex; justify-content: center;">
      <div><button id="start-btn" type="button" >Practice Aim</button></div>
      <div><button id="exit-btn" type="button" >Exit</button></div>
    </div>
    <div class="title">
      <input id="input-game" type="text" value="wait for game..." style="margin-top: 1em; width: 100%;" readonly >
    </div>

    <div id="aim-area" style="
    border: 1px solid black;
  
    height: calc(100vh - (16px + 34px + 20px));   /* mt | input | btn */
    position: relative;
    margin-top: 1em;
    ">
    <div id="target" style="
    width: 50px;
    height: 50px;
    background-color: red;
    display: none;
    border-radius: 999px;
    position: absolute;
    "></div>
      
    </div>
  </div>
</body>

<script>
 
  let gameStart = false;
  let startTime = 0;
  let startCountdown = 0;
  let totalClickNeeded = 5;
  let countdownTimer; 
  let countClick = 0;
  
  function onCountdown(){
    if(startCountdown === 1){
      input.value = "Game Start"
      gameStart = true;
      clearInterval(countdownTimer);
      randomPosition();
    }else{
      startCountdown --;
      input.value = `start game in ${startCountdown}...`
    }
  }

  function randomTarget(){
    const aimArea = document.getElementById("aim-area");
      aimArea.width = innerWidth;
      aimArea.height = innerHeight;
      // เลข 50 คือขนาดของวงกลมแดง - เพื่อไม่ให้ล้น
      const maxX = aimArea.clientWidth - 50;
      const maxY = aimArea.clientHeight - 50;
      // สุ่มตำแหน่ง
      const randomLeft = Math.floor(Math.random() * maxX);
      const randomTop = Math.floor(Math.random() * maxY);
      // แทนค่าตำแหน่ง
      target.style.top = `${randomTop}px`
      target.style.left = `${randomLeft}px`
  }
  function randomPosition() {
    if (gameStart === true) {
      target.style.display = "block";
      input.value = `Click the target`
      const aimArea = document.getElementById("aim-area");
      aimArea.width = innerWidth;
      aimArea.height = innerHeight;
      
      const maxX = aimArea.clientWidth - 50;
      const maxY = aimArea.clientHeight - 50;
      // สุ่มตำแหน่ง
      const randomLeft = Math.floor(Math.random() * maxX);
      const randomTop = Math.floor(Math.random() * maxY);
  
      target.style.top = `${randomTop}px`
      target.style.left = `${randomLeft}px`
    }
  }
  const target = document.getElementById('target'); 
 
  target.addEventListener('click',(e)=>{
        
        if(gameStart){
          countClick++
          console.log(`Count Click = ${countClick}`)
        }
        if(countClick === 3){
          gameStart = false;
          target.style.display = "none";
          alert('Game done')
        }else{
          randomTarget();
        }
          
      }) 
     
  function resetGame() {
    // รีเซ็ตค่าตัวแปรทั้งหมด
    gameStart = false;
    startTime = 0;
    startCountdown = 0;
    countClick = 0;
    
    // รีเซ็ต UI
    target.style.display = "none";
    input.value = "wait for game...";
    if (countdownTimer) {
      clearInterval(countdownTimer);
    }
  }
  // (1)
  function startGame() {
    // รีเซ็ทเกมก่อนเริ่ม
    
    resetGame();
    // เริ่มเกม
    input.value = "start game in 3...";
    startCountdown = 3;
    countdownTimer = setInterval(onCountdown, 1000);
  }

  const startBtn = document.getElementById("start-btn");
  const exitBtn = document.getElementById("exit-btn");
  const input = document.getElementById("input-game");
  
  exitBtn.addEventListener('click',()=>{
    resetGame();
  });
  startBtn.addEventListener('click',startGame);
</script>

</html>
